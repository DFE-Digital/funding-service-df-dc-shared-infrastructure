parameters:
- name: Environment
  type: string
- name: AzureServiceConnection
  type: string
- name: StorageAccountName
  type: string
- name: StorageAccountResourceGroup
  type: string
- name: KeyVaultName
  type: string

jobs:
- deployment: DeployTo${{ parameters.Environment }}
  displayName: "Deploy To ${{ parameters.Environment }}"
  environment: Doc Capture - ${{ parameters.Environment }}
  strategy:
    runOnce:
      deploy:
        steps:
        - task: AzureCLI@2
          displayName: 'Rotating storage keys'
          inputs:
            azureSubscription: '${{ parameters.AzureServiceConnection }}'
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              $weekOfYear = Get-date -UFormat %V

              $isEvenWeek = ($weekOfYear % 2) -eq 0

              $keyToSwap = "primary"

              if(-not $isEvenWeek) {
                $keyToSwap = "secondary"
              }

              Write-Host "Updating storage account key $keyToSwap".

              ## Rotate key...
              az storage account keys renew -g ${{ parameters.StorageAccountResourceGroup }} -n ${{ parameters.StorageAccountName }} --key $keyToSwap | Out-Null

              ## Get new connection string
              $connStrJson = az storage account show-connection-string -g ${{ parameters.StorageAccountResourceGroup }} -n ${{ parameters.StorageAccountName }} --key $keyToSwap

              $connStrObj = $connStrJson | ConvertFrom-Json

              $connstr = $connStrObj.connectionString

              ## Push new key to key vault.
              az keyvault secret set --name AzureStorageConnectionString --vault-name ${{ parameters.KeyVaultName }} --value $connstr | Out-Null

              Write-Host "Updated connection string saved to key vault"
